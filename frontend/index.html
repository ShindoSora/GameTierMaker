                          border: psnCategories.includes(cat.key) ? '1px solid var(--accent)' : '1px solid var(--border)',
                        }}>
                          <input type="checkbox" style={{accentColor:'var(--accent)'}}
                            checked={psnCategories.includes(cat.key)}
                            onChange={() => togglePsnCategory(cat.key)} />
                          {cat.label}
                        </label>
                      ))}
                    </div>
                  </div>

                  <div style={{marginBottom:14}}>
                    <label style={{display:'block', fontSize:12, fontWeight:600, marginBottom:4, color:'var(--text-secondary)'}}>{t('psn.minimumPlaytime')}</label>
                    <input className="input" style={{width:'100%'}} type="number" min="0" step="0.1"
                      value={psnMinPlayDuration}
                      onChange={e => setPsnMinPlayDuration(parseFloat(e.target.value) || 0)}
                      placeholder={t('psn.noPlaytimeFilter')} />
                  </div>

                  <div style={{height:1, background:'var(--divider)', marginBottom:16}}></div>

                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
                    <span style={{fontSize:13, fontWeight:600}}>{t('account.boundAccounts')}</span>
                    <button className="btn btn-xs" onClick={loadPsnAccounts}>{t('actions.refresh')}</button>
                  </div>

                  {Object.keys(psnAccounts).length === 0 ? (
                    <p style={{textAlign:'center', color:'var(--text-secondary)', padding:20, fontSize:13}}>
                      {t('psn.noAccounts')}
                    </p>
                  ) : (
                    Object.entries(psnAccounts).map(([accountId, info]) => (
                      <div key={accountId} className="steam-account-row">
                        <AccountAvatar src={info.avatarfull || ''} name={info.onlineId || accountId} />
                        <div className="name">{info.onlineId || accountId}</div>
                        <div className="actions">
                          <button className="btn btn-xs btn-primary" onClick={() => handlePsnSync(accountId)} disabled={!!settingsOperation}>{t('actions.sync')}</button>
                          <button className="btn btn-xs" style={{color:'var(--danger)'}}
                            onClick={() => handlePsnDeleteImages(accountId)}>{t('actions.deleteImages')}</button>
                          <button className="btn btn-xs btn-danger" onClick={() => handlePsnUnbind(accountId)}>{t('actions.unbind')}</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {settingsActiveSection === 'xbox_accounts' && (
                <div>
                  <SettingsSectionHeading title="Xbox" />
                  {/* Xbox 玩家代号 + 绑定 */}
                  <div style={{marginBottom:14}}>
                    <label style={{display:'block', fontSize:12, fontWeight:600, marginBottom:4, color:'var(--text-secondary)'}}>{t('xbox.gamertag')}</label>
                    <div style={{display:'flex', gap:8}}>
                      <input className="input" style={{flex:1}} value={xboxGamertag}
                        onChange={e => setXboxGamertag(e.target.value)}
                        placeholder={t('xbox.gamertagPlaceholder')} />
                      <button className="btn btn-sm btn-primary" onClick={handleXboxBind} disabled={!!settingsOperation}
                        style={{flexShrink:0, padding:'6px 20px'}}>{t('actions.bind')}</button>
                    </div>
                  </div>

                  <div style={{height:1, background:'var(--divider)', margin:'16px 0'}}></div>

                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
                    <span style={{fontSize:13, fontWeight:600}}>{t('account.boundAccounts')}</span>
                    <button className="btn btn-xs" onClick={loadXboxAccounts}>{t('actions.refresh')}</button>
                  </div>

                  {Object.keys(xboxAccounts).length === 0 ? (
                    <p style={{textAlign:'center', color:'var(--text-secondary)', padding:20, fontSize:13}}>
                      {t('xbox.noAccounts')}
                    </p>
                  ) : (
                    Object.entries(xboxAccounts).map(([xuid, info]) => (
                      <div key={xuid} className="steam-account-row">
                        <AccountAvatar src={info.avatarfull || ''} name={info.gamertag || xuid} />
                        <div className="name">{info.gamertag || xuid}</div>
                        <div className="actions">
                          <button className="btn btn-xs btn-primary" onClick={() => handleXboxSync(xuid)} disabled={!!settingsOperation}>{t('actions.sync')}</button>
                          <button className="btn btn-xs" style={{color:'var(--danger)'}}
                            onClick={() => handleXboxDeleteImages(xuid)}>{t('actions.deleteImages')}</button>
                          <button className="btn btn-xs btn-danger" onClick={() => handleXboxUnbind(xuid)}>{t('actions.unbind')}</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {settingsActiveSection === 'nintendo_accounts' && (
                <div>
                  <SettingsSectionHeading title="Nintendo" />
                  <p style={{margin:'0 0 12px', fontSize:12, color:'var(--text-secondary)', lineHeight:1.7}}>
                    {t('nintendo.bindHelp')}
                  </p>
                  <button className="btn btn-sm btn-primary" onClick={handleNintendoStart} disabled={!!settingsOperation}>
                    {t('nintendo.openLogin')}
                  </button>

                  {nintendoAuthOperation && (
                    <div style={{marginTop:12, padding:12, border:'1px solid var(--border)', borderRadius:'var(--radius-md)', background:'var(--surface)'}}>
                      <p style={{margin:'0 0 8px', fontSize:11, color:'var(--text-secondary)', lineHeight:1.6}}>{t('nintendo.callbackHelp')}</p>
                      <input className="input" style={{width:'100%', marginBottom:8, fontSize:11}} value={nintendoAuthorizeUrl} readOnly onFocus={e => e.target.select()} />
                      <label style={{display:'block', fontSize:12, fontWeight:600, marginBottom:5, color:'var(--text-secondary)'}}>
                        {t('nintendo.callbackLabel')}
                      </label>
                      <textarea className="input" rows="3" style={{width:'100%', resize:'vertical'}} value={nintendoCallback}
                        onChange={e => setNintendoCallback(e.target.value)} placeholder={t('nintendo.callbackPlaceholder')} />
                      <button className="btn btn-sm btn-primary" style={{marginTop:8}} onClick={handleNintendoComplete} disabled={!!settingsOperation}>
                        {t('nintendo.verifyCallback')}
                      </button>
                    </div>
                  )}

                  <div style={{height:1, background:'var(--divider)', margin:'16px 0'}}></div>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
                    <span style={{fontSize:13, fontWeight:600}}>{t('account.boundAccounts')}</span>
                    <button className="btn btn-xs" onClick={loadNintendoAccounts}>{t('actions.refresh')}</button>
                  </div>

                  {Object.keys(nintendoAccounts).length === 0 ? (
                    <p style={{textAlign:'center', color:'var(--text-secondary)', padding:20, fontSize:13}}>{t('nintendo.noAccounts')}</p>
                  ) : (
                    Object.entries(nintendoAccounts).map(([accountId, info]) => (
                      <div key={accountId} className="steam-account-row">
                        <div className="avatar-fallback" style={{width:40, height:40, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--accent-glow)', color:'var(--accent)', flexShrink:0}}>N</div>
                        <div className="name" style={{display:'flex', flexDirection:'column', gap:2}}>
                          <span>{info.display_name || accountId}</span>
                          <small style={{fontSize:10, color: info.needs_reauth ? 'var(--danger)' : 'var(--text-secondary)'}}>
                            {info.needs_reauth ? t('nintendo.reauthRequired') : (info.last_sync_at ? t('nintendo.lastSynced') : t('nintendo.notSynced'))}
                          </small>
                        </div>
                        <div className="actions">
                          <button className="btn btn-xs btn-primary" onClick={() => handleNintendoSync(accountId)} disabled={!!settingsOperation}>{t('actions.sync')}</button>
                          <button className="btn btn-xs" style={{color:'var(--danger)'}} onClick={() => handleNintendoDeleteImages(accountId)}>{t('actions.deleteImages')}</button>
                          <button className="btn btn-xs btn-danger" onClick={() => handleNintendoUnbind(accountId)}>{t('actions.unbind')}</button>
                        </div>
                      </div>
                    ))
                  )}

                  {nintendoPreview && (
                    <div style={{marginTop:16, borderTop:'1px solid var(--divider)', paddingTop:14}}>
                      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
                        <span style={{fontSize:13, fontWeight:600}}>{t('nintendo.previewTitle', {count: nintendoPreview.received || 0})}</span>
                        <span style={{fontSize:11, color:'var(--text-secondary)'}}>{t('nintendo.selectedCount', {count: nintendoSelected.size})}</span>
                      </div>
                      <div style={{maxHeight:280, overflowY:'auto', border:'1px solid var(--border)', borderRadius:'var(--radius-md)'}}>
                        {(nintendoPreview.titles || []).map(title => (
                          <label key={title.record_key} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 9px', borderBottom:'1px solid var(--divider)', cursor:'pointer'}}>
                            <input type="checkbox" style={{accentColor:'var(--accent)'}} checked={nintendoSelected.has(title.record_key)}
                              onChange={() => setNintendoSelected(previous => { const next = new Set(previous); next.has(title.record_key) ? next.delete(title.record_key) : next.add(title.record_key); return next; })} />
                            <span style={{flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{title.title_name}</span>
                            <span style={{fontSize:10, color:'var(--text-secondary)', flexShrink:0}}>{title.total_played_minutes == null ? t('nintendo.unknownTime') : t('nintendo.minutes', {count: title.total_played_minutes})}</span>
                          </label>
                        ))}
                      </div>
                      <div style={{display:'flex', gap:8, marginTop:10}}>
                        <button className="btn btn-sm btn-primary" onClick={handleNintendoImport} disabled={!!settingsOperation || !nintendoSelected.size}>{t('nintendo.importSelected')}</button>
                        <button className="btn btn-sm" onClick={() => { setNintendoPreview(null); setNintendoSelected(new Set()); setNintendoImportRequestId(''); }} disabled={!!settingsOperation}>{t('actions.cancel')}</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {settingsActiveSection === 'download' && (
                <div>
                  <SettingsSectionHeading title={t('settings.tabs.download')} />
                  {downloadSettings?.runtime_mode === 'browser' ? (
                    <div style={{padding:'14px', border:'1px solid var(--border)', borderRadius:'var(--radius-md)', background:'var(--surface)'}}>
                      <div style={{fontSize:13, fontWeight:600, marginBottom:8}}>{t('download.browserManagedTitle')}</div>
                      <p style={{fontSize:12, color:'var(--text-secondary)', lineHeight:1.7, margin:0}}>
                        {t('download.browserManagedDescription')}
                      </p>
                    </div>
                  ) : downloadSettings ? (
                    <div>
                      <p style={{fontSize:13, color:'var(--text-secondary)', lineHeight:1.7, marginBottom:16}}>
                        {t('download.desktopDescription')}
                      </p>
                      <label style={{display:'block', fontSize:12, fontWeight:600, marginBottom:6, color:'var(--text-secondary)'}}>
                        {t('download.directory')}
                      </label>
                      <div style={{display:'flex', gap:8}}>
                        <input className="input" style={{flex:1, minWidth:0}}
                          value={downloadDirectory}
                          onChange={event => setDownloadDirectory(event.target.value)}
                          placeholder={downloadSettings.effective_directory || t('download.systemDefault')} />
                        <button className="btn btn-sm" onClick={handleChooseDownloadDirectory}
                          disabled={downloadSaving || downloadSelecting} style={{flexShrink:0}}>
                          {downloadSelecting ? t('common.pleaseWait') : t('download.choose')}
                        </button>
                      </div>
                      <div style={{fontSize:11, color:'var(--text-secondary)', lineHeight:1.6, marginTop:8, overflowWrap:'anywhere'}}>
                        {t('download.effectiveDirectory')}: {downloadSettings.effective_directory}
                      </div>
                      {!downloadSettings.is_valid && (
                        <div style={{fontSize:11, color:'var(--danger)', lineHeight:1.6, marginTop:8}}>
                          {t('download.invalidFallback')}
                        </div>
                      )}
                      <div style={{display:'flex', gap:8, marginTop:16}}>
                        <button className="btn btn-sm btn-primary"
                          onClick={() => handleSaveDownloadDirectory(downloadDirectory.trim())}
                          disabled={downloadSaving || downloadSelecting}>
                          {downloadSaving ? t('common.pleaseWait') : t('actions.save')}
                        </button>
                        <button className="btn btn-sm"
                          onClick={() => handleSaveDownloadDirectory('')}
                          disabled={downloadSaving || downloadSelecting}>
                          {t('download.restoreDefault')}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <p style={{fontSize:13, color:'var(--text-secondary)'}}>{t('common.pleaseWait')}</p>
                  )}
                </div>
              )}

            {settingsActiveSection === 'storage' && (
              <div>
                <SettingsSectionHeading title={t('settings.tabs.cleanup')} />
                <p style={{fontSize:13, color:'var(--text-secondary)', marginBottom:16}}>
                  {t('storage.description')}
                </p>
                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                  {[
                    {key:'steam', label:t('storage.clearSteam')},
                    {key:'igdb', label:t('storage.clearIgdb')},
                    {key:'bangumi', label:t('storage.clearBangumi')},
                    {key:'vndb', label:t('storage.clearVndb')},
                    {key:'steamgriddb', label:t('storage.clearSteamgriddb')},
                    {key:'xbox', label:t('storage.clearXbox')},
                    {key:'nintendo', label:t('storage.clearNintendo')},
                    {key:'cache', label:t('storage.clearGeneric')},
                  ].map(s => (
                    <button key={s.key} className="btn btn-sm" onClick={() => handleClearSource(s.key)}
                      style={{justifyContent:'center'}}>{s.label}</button>
                  ))}
                    <button className="btn btn-sm" onClick={handleClearLogFile}
                             style={{justifyContent:'center', marginTop:8}}>{t('storage.clearLogFile')}</button>
                  <button className="btn btn-sm btn-danger" onClick={() => handleClearSource('')}
                    style={{justifyContent:'center', marginTop:8}}>{t('storage.clearAllSources')}</button>
                  <button className="btn btn-sm btn-danger" onClick={handleResetAllImages}
                    style={{justifyContent:'center', marginTop:8, background:'var(--danger)', borderColor:'var(--danger)', color:'#fff'}}>{t('storage.resetProject')}</button>
                </div>
              </div>
            )}

            {settingsActiveSection === 'licenses' && (
              <div>
                <SettingsSectionHeading title={t('settings.tabs.licenses')} description={t('settings.licensesDescription')} />
                {openSourceLicenses.length === 0 ? (
                  <p style={{fontSize:13, color:'var(--text-secondary)'}}>{t('common.pleaseWait')}</p>
                ) : (
                  <div style={{display:'flex', flexDirection:'column', gap:14}}>
                    {openSourceLicenses.map(license => (
                      <section key={license.id} style={{
                        border:'1px solid var(--border-strong)', borderRadius:'var(--radius-md)',
                        background:'var(--surface)', overflow:'hidden'
                      }}>
                        <div style={{padding:'10px 12px', borderBottom:'1px solid var(--divider)', display:'flex', justifyContent:'space-between', gap:8, alignItems:'baseline'}}>
                          <span style={{fontSize:13, fontWeight:700}}>{license.name}</span>
                          <span style={{fontSize:11, color:'var(--text-secondary)', whiteSpace:'nowrap'}}>{license.license}</span>
                        </div>
                        <pre style={{margin:0, padding:12, maxHeight:260, overflow:'auto', whiteSpace:'pre-wrap', fontFamily:'Consolas, monospace', fontSize:11, lineHeight:1.5, color:'var(--text-secondary)'}}>{license.text}</pre>
                      </section>
                    ))}
                  </div>
                )}
              </div>
            )}

          </div>
          </div>
        </div>
        </div>
      )}

      {/* 颜色选择器 */}
      {colorPicker && colorPicker.show && (
        <div style={{
          position:'fixed', inset:0, zIndex:5000,
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'rgba(0,0,0,0.5)', backdropFilter:'blur(4px)'
        }} onClick={() => setColorPicker(null)}>
          <div style={{
            background:'var(--bg-secondary)', border:'1px solid var(--border-strong)',
            borderRadius:'var(--radius-lg)', padding:24, width:320,
            boxShadow:'0 16px 48px rgba(0,0,0,0.5)'
          }} onClick={e => e.stopPropagation()}>
            <div style={{fontSize:15, fontWeight:700, marginBottom:16}}>
              {t('tier.colorDialogTitle', {tierLabel: colorPicker.tierLabel})}
            </div>

            {/* 调色盘 */}
            <input type="color" value={colorPicker.color || '#808080'}
              onChange={e => setColorPicker({...colorPicker, color: e.target.value})}
              style={{width:'100%', height:48, border:'none', borderRadius:'var(--radius-sm)',
                cursor:'pointer', background:'transparent', marginBottom:16}} />

            {/* 常用配色 */}
            <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:6, marginBottom:16}}>
              {PRESET_COLORS.map(c => (
                <div key={c} onClick={() => setColorPicker({...colorPicker, color: c})}
                  style={{
                    width:32, height:32, borderRadius:6, background:c, cursor:'pointer',
                    border: colorPicker.color === c ? '2px solid var(--text-primary)' : '2px solid transparent',
                    transition:'transform var(--transition-fast), border 0.15s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.2)'}
                  onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                  title={c} />
              ))}
            </div>

            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button className="btn btn-sm" onClick={() => setColorPicker(null)}>{t('actions.cancel')}</button>
              <button className="btn btn-sm btn-primary" onClick={applyTierColor}
                disabled={!colorPicker.color}>{t('actions.apply')}</button>
            </div>
          </div>
        </div>
      )}

      {/* 等级行右键菜单（顶层渲染，避免被 GlowCard transform 影响定位） */}
      {tierContextMenu && (
        <div className="context-menu" style={{ left: tierContextMenu.x, top: tierContextMenu.y }}
          onClick={() => setTierContextMenu(null)}>
          <div className="context-menu-item" onClick={() => {
            handleColorTier(tierContextMenu.tierId, tierContextMenu.tierLabel);
          }}>{t('tier.changeColor')}</div>
          <div className="context-menu-separator" />
          <div className="context-menu-item" style={{color:'var(--danger)'}} onClick={() => {
            handleDeleteTier(tierContextMenu.tierId);
            setTierContextMenu(null);
          }}>{t('tier.delete')}</div>
        </div>
      )}

      {/* Import Presets Modal */}
      {showPresetsModal && (
        <div style={{
          position:'fixed', inset:0, zIndex:3000,
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'rgba(0,0,0,0.6)', backdropFilter:'blur(4px)'
        }} onClick={() => setShowPresetsModal(false)}>
          <div style={{
            background:'var(--bg-secondary)', border:'1px solid var(--border-strong)',
            borderRadius:'var(--radius-xl)', width:420, maxHeight:'70vh',
            display:'flex', flexDirection:'column',
            boxShadow:'0 16px 48px rgba(0,0,0,0.5)'
          }} onClick={e => e.stopPropagation()}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderBottom:'1px solid var(--divider-strong)' }}>
                {/*<span style={{fontSize:16, fontWeight:700}}>{t('preset.title')}</span>*/}
              <button className="btn btn-icon btn-sm" onClick={() => setShowPresetsModal(false)}>✕</button>
            </div>
            <div style={{ padding:18, overflow:'auto', flex:1 }}>
              {presetsList.length === 0 || !presetsList.some(p => p.total_images > 0) ? (
                <p style={{textAlign:'center', color:'var(--text-secondary)', padding:30, fontSize:14}}>{t('preset.empty')}</p>
              ) : (
                presetsList.map(p => (
                  <div key={p.template_id} style={{
                    display:'flex', alignItems:'center', justifyContent:'space-between',
                    padding:'12px 14px', marginBottom:8,
                    background:'var(--bg-tertiary)', borderRadius:'var(--radius-md)',
                    border:'1px solid var(--border)'
                  }}>
                    <div>
                      <div style={{fontWeight:600, fontSize:14}}>{getTemplateDisplayName(p.template_name)}</div>
                      <div style={{fontSize:12, color:'var(--text-secondary)', marginTop:2}}>{t('preset.imageCount', {count: p.total_images})}</div>
                    </div>
                    <button className="btn btn-primary btn-sm"
                      onClick={() => handleImportFromTemplate(p.template_id)}
                      style={{flexShrink:0}}>
                      {t('actions.import')}
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

    </div>
  );

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />)
</script>
</body>
</html>
